<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易课 EasyClass · 顶部导航栏</title>
<style>
  /* ========== 基础重置 ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ========== 容器：固定顶部，毛玻璃 ========== */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;

    background: rgba(30, 30, 40, 0.7);      /* 半透明底色 */
    backdrop-filter: blur(8px);              /* 毛玻璃模糊 */
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;                            /* 置顶但低于系统菜单 */

    font-size: 14px;                          /* 整体统一字号 */
    color: #f0f0f5;
    line-height: 40px;                        /* 文字垂直居中兜底 */
    white-space: nowrap;
    overflow: hidden;                         /* 防止横向撑破页面 */
    user-select: none;
  }

  /* ========== 三个分组：左 / 中 / 右 ========== */
  .topbar__left,
  .topbar__center,
  .topbar__right {
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  /* 课程信息：永不压缩、不换行 */
  .topbar__left {
    flex: 0 0 auto;
    flex-shrink: 0;
    min-width: max-content;
  }

  /* 时钟 + 日期：绝对完整显示，禁止被挤压 */
  .topbar__center {
    flex: 0 0 auto;
    flex-shrink: 0;
    min-width: max-content;
    gap: 12px;
  }

  /* 天气：宽度不足时优先隐藏（见下方媒体查询） */
  .topbar__right {
    flex: 0 0 auto;
    flex-shrink: 0;
  }

  /* ========== 左侧：课程信息 ========== */
  .course {
    margin-right: 20px;
    font-weight: 400;                         /* 不粗 */
    display: inline-flex;
    align-items: center;
  }

  /* 左侧 tiny 状态圆点图标（纯 CSS，无图片） */
  .course::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 8px;
    border-radius: 50%;
    background: #22c55e;                       /* 绿色：空闲/正常 */
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
  }

  /* ========== 中间：时钟 + 日期 ========== */
  .clock {
    font-variant-numeric: tabular-nums;       /* 数字等宽，避免跳动 */
    font-weight: 600;
  }

  .date {
    color: #a0a0b8;                            /* 次级文字 */
    font-weight: 400;
  }

  /* ========== 右侧：天气 ========== */
  .weather {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 400;
  }
  /* 天气 tiny 图标（纯 CSS 太阳） */
  .weather::before {
    content: '☀';
    font-size: 13px;
    line-height: 1;
  }

  /* ========== 解决重叠：宽度不足时优先隐藏天气 ========== */
  @media (max-width: 720px) {
    .topbar__right { display: none; }         /* 天气第一个被隐藏 */
  }

  /* 极端窄屏：天气已隐藏后，再隐藏左侧课程信息，时钟+日期始终保留 */
  @media (max-width: 520px) {
    .topbar__left { display: none; }
  }
</style>
</head>
<body>
  <!-- ========== 顶部导航栏 ========== -->
  <nav class="topbar">
    <!-- 左：课程信息 -->
    <div class="topbar__left">
      <span class="course" id="course">今日无课程安排</span>
    </div>

    <!-- 中：时钟 + 日期 -->
    <div class="topbar__center">
      <span class="clock" id="clock">20:11</span>
      <span class="date" id="date">08-11 周二</span>
    </div>

    <!-- 右：天气 -->
    <div class="topbar__right">
      <span class="weather" id="weather">25°</span>
    </div>
  </nav>

  <script>
    // ========== 动态内容（时钟/日期） ==========
    const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes());           // 20:11 去除秒
      document.getElementById('date').textContent =
        pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + WEEK[now.getDay()]; // 08-11 周二
    }

    tick();
    setInterval(tick, 30000);   // 无秒显示，每 30 秒刷新即可

    // 天气可在此动态赋值，例如：
    // document.getElementById('weather').textContent = '25°';
  </script>
</body>
</html>
